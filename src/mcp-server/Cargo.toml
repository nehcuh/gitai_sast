[package]
name = "mcp-server"
version = "0.1.0"
edition = "2021"

[dependencies]
# Async runtime
tokio = { version = "1.34", features = ["full"] }
tokio-util = "0.7"
futures = "0.3"

# JSON-RPC
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
jsonrpsee = { version = "0.22", features = ["server", "client"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Utilities
uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# HTTP Client
reqwest = { version = "0.11", default-features = false, features = ["json", "multipart", "rustls-tls-native-roots"] }

# Encryption
aes = "0.8"
block-modes = "0.8"
base64 = "0.21"

# Regex
regex = "1.10"

# File system
walkdir = "2.4"

# Hashing
md-5 = "0.10"
sha2 = "0.10"
async-trait = "0.1.89"
tempfile = "3.24.0"
which = "8.0.0"
dirs = "6.0.0"
zip = "7.0.0"

# Config file support
toml = "0.8"
serde_yaml = "0.9"

[dev-dependencies]
tokio-test = "0.4"
